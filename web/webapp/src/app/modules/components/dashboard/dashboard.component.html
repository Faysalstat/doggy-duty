<p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }" />
<div class="d-flex justify-content-between align-items-center mt-3">
    <h2 class="mb-0">WORK ORDERS</h2>

    <div class="d-flex gap-2">
        <button (click)="downloadWorkOrder()" class="btn btn-bg-primary">Download</button>
        <button (click)="openNewTaskDialog()" class="btn btn-primary d-flex align-items-center">
            <i class="bi bi-plus-lg me-2"></i> New Task
        </button>
    </div>
</div>

<h4 style="font-size: 1.2rem; color: #555; margin-top: 10px;">{{ getFormattedDate() }}</h4>
<hr />
<app-task-details (fetchListEmmiter)="fetchJobOrder()" [communityList]="communityList"></app-task-details>
