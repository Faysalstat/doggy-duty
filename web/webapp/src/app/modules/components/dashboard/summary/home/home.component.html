<div class="container mt-3">
    <div class="row">
      <!-- Earnings Card -->
      <div class="col-md-6">
        <mat-card class="earning-card earnings">
          <mat-card-content class="d-flex align-items-center">
            <mat-icon class="icon">attach_money</mat-icon>
            <div class="ms-3">
              <h5 class="mb-1">Total Earnings</h5>
              <p class="amount">${{ totalEarnings | number:'1.2-2' }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
  
      <!-- Tax Collected Card -->
      <div class="col-md-6">
        <mat-card class="earning-card tax">
          <mat-card-content class="d-flex align-items-center">
            <mat-icon class="icon">account_balance</mat-icon>
            <div class="ms-3">
              <h5 class="mb-1">Total Tax Collected</h5>
              <p class="amount">${{ totalTaxCollected | number:'1.2-2' }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
