<div class="container mt-3">
  <div class="row">
    <div class="col-md-12">
      
      <div style="position: relative; display: inline-flex; align-items: center; gap: 8px; vertical-align: middle;">
        <h2 class="mb-4" style="margin: 0; line-height: 1;">Earnings Summary for year {{selectedYear}}</h2>
        <input
          matInput
          [matDatepicker]="yearPicker"
          [value]="selectedDate"
          hidden
          #yearInput
        />
      
        <button mat-icon-button (click)="yearPicker.open()" aria-label="Select year" style="margin-top: -25px;">
          <mat-icon>calendar_today</mat-icon>
        </button>
      </div>
      
      <mat-datepicker
        #yearPicker
        startView="multi-year"
        (yearSelected)="chooseYear($event, yearPicker)"
        panelClass="year-picker"
      ></mat-datepicker>
    </div>
  </div>
    <div class="row">
      <!-- Earnings Card -->
      
      <mat-datepicker
          #yearPicker
          startView="multi-year"
          (yearSelected)="chooseYear($event, yearPicker)"
          panelClass="year-only-picker"
        ></mat-datepicker>
      <div class="col-md-6">
        <mat-card class="earning-card earnings">
          <mat-card-content class="d-flex align-items-center">
            <mat-icon class="icon">attach_money</mat-icon>
            <div class="ms-3">
              <h5 class="mb-1">Total Earnings</h5>
              <p class="amount">${{ totalEarnings | number:'1.2-2' }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
  
      <!-- Tax Collected Card -->
      <div class="col-md-6">
        <mat-card class="earning-card tax">
          <mat-card-content class="d-flex align-items-center">
            <mat-icon class="icon">account_balance</mat-icon>
            <div class="ms-3">
              <h5 class="mb-1">Total Tax Collected</h5>
              <p class="amount">${{ totalTaxCollected | number:'1.2-2' }}</p>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
