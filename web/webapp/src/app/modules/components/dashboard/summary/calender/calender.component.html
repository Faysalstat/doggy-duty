<div class="container mt-3">
  <mat-card class="calendar-card">
    <mat-card-content>
      <h3>My Google Calendar</h3>
      <iframe src="https://calendar.google.com/calendar/embed?src=doggydutypro%40gmail.com&ctz=America%2FNew_York"
        style="border: 0" width="100%" height="600" frameborder="0" scrolling="no">
      </iframe>
      <div class="mt-3">
        <button mat-raised-button color="primary" (click)="openGoogleCalendar()">
          Add Task/Event
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
