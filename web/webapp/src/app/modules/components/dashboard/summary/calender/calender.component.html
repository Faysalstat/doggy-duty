<div class="container mt-3">
  <mat-card class="calendar-card">
    <mat-card-content>
      <h3>Add Task/Event</h3>
      <form [formGroup]="eventCreateForm" (keydown.enter)="$event.preventDefault()">
        <div class="row">
          <div class="col-md-4">
            <mat-form-field class="input-field" appearance="outline">
                <mat-label>Scheduled Date</mat-label>
                <input 
                    (dateChange)="onDateChange($event)" 
                    [ngModelOptions]="{standalone:true}" 
                    [(ngModel)]="scheduledDate" 
                    matInput 
                    [matDatepicker]="startDate" 
                    required>
                <mat-datepicker-toggle matIconSuffix [for]="startDate"></mat-datepicker-toggle>
                <mat-datepicker #startDate></mat-datepicker>
            </mat-form-field>
            <div *ngIf="!scheduledDate" class="text-danger">
                Start Date is required.
            </div>
        </div>
          <div class="col-md-12">
            <mat-form-field class="input-field" appearance="outline">
              <mat-label>Event Title</mat-label>
              <input placeholder="title" formControlName="title" matInput>
            </mat-form-field>
          </div>
          <div class="col-md-12">
            <mat-form-field class="input-field" appearance="outline">
              <mat-label>Event Description</mat-label>
              <textarea placeholder="description" formControlName="description" matInput></textarea>
            </mat-form-field>
          </div>
          <div class="col-12 d-flex justify-content-end mt-3" style="width: 100%;">
            <button (click)="submitForm()" class="btn-bg-primary">Add Task</button>
        </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
